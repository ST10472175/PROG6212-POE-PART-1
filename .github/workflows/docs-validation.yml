name: Validate Project Structure

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "Checking PROG6212_POE project structure..."

          test -d src
          test -d src/main
          test -d src/test

          test -d docs
          test -d docs/requirements
          test -d docs/reports

          test -d assets
          test -d data
          test -d config
          test -d lib
          test -d scripts

          test -f README.md
          test -f .gitignore
          test -f project-plan.md

          echo "Project structure validation passed!"
