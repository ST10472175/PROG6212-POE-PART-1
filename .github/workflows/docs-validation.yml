name: Validate Docs Structure

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docs folder
        run: |
          echo "Checking docs folder structure..."
          test -d docs/requirements
          test -d docs/reports
          echo "Docs validation passed!"
