name: SQL Server Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-sql-script:
    name: Test SQL Script on Clean SQL Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start clean SQL Server
        run: |
          docker run \
            --name sqlserver \
            --hostname sqlserver \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=SqlServer@2026StrongPassword!" \
            -p 1433:1433 \
            -d \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server to start..."
          for i in {1..60}
          do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P 'SqlServer@2026StrongPassword!' \
              -C \
              -Q "SELECT 1" > /dev/null 2>&1
            then
              echo "SQL Server is ready."
              exit 0
            fi
            echo "SQL Server not ready yet..."
            sleep 2
          done
          echo "ERROR: SQL Server failed to start."
          docker logs sqlserver
          exit 1

      - name: Check SQL script exists
        run: |
          if [ ! -f "PROG POE.sql" ]; then
            echo "ERROR: PROG POE.sql does not exist."
            exit 1
          fi
          echo "SQL script found."

      - name: Run SQL script
        run: |
          echo "Executing SQL script against clean SQL Server..."
          docker cp "PROG POE.sql" sqlserver:/tmp/database.sql
          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P 'SqlServer@2026StrongPassword!' \
            -C \
            -b \
            -i /tmp/database.sql

      - name: SQL validation successful
        run: |
          echo "======================================"
          echo "SQL script executed successfully!"
          echo "======================================"

      - name: Show SQL Server logs if validation fails
        if: failure()
        run: |
          docker logs sqlserver

      - name: Stop SQL Server
        if: always()
        run: |
          docker stop sqlserver || true
          docker rm sqlserver || true
